baseURL: "https://paulinepic.github.io/" # MUST end with slash
title: "Pauline Pic"
defaultContentLanguage: fr
defaultContentLanguageInSubdir: false
timeZone: America/Toronto
enableRobotsTXT: true
buildFuture: true # forthcoming works carry 2027 dates
disableKinds: [taxonomy, term] # no auto-generated tag/author term pages

module:
  mounts:
    - {source: archetypes, target: archetypes}
    - {source: assets, target: assets}
    - {source: data, target: data}
    - {source: i18n, target: i18n}
    - {source: layouts, target: layouts}
    - {source: static, target: static}
    - {source: content, target: content, lang: fr}
    - {source: content-en, target: content, lang: en}
    # Publications and talks are shared by both languages (their titles stay in the original language).
    - {source: content/publication, target: content/publication, lang: en, excludeFiles: ["_index.md"]}
    - {source: content/talk, target: content/talk, lang: en, excludeFiles: ["_index.md"]}
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind

outputs:
  home: [HTML, RSS]

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  owner:
    name: "Pauline Pic"
    email: "pauline_pic@uqar.ca"
  appearance:
    theme_day: custom
    theme_night: custom
    color_mode: light
    color: blue
    font: native
    font_size: L
  header:
    navbar:
      enable: true
      show_search: true
      logo:
        text: "Pauline Pic"
  features:
    search:
      provider: flexsearch # Blox default; Pagefind runs through the overridden search modal
  extensions:
    css:
      - css/custom.css
  mysite:
    credit: true # footer credit "Created using GaryKing.org/mysite"
    discovery: true # invisible generator meta tag + homepage Person JSON-LD
    design:
      seed: "none"
      note: "Design drawn by hand from the owner's CV logo palette; the mysite design quest file was unreachable during the build."

taxonomies:
  tag: tags

permalinks:
  publication: /publication/:contentbasename/
  talk: /talk/:contentbasename/
  software: /software/:contentbasename/

sitemap:
  changefreq: monthly
  priority: 0.5


languages:
  fr:
    languageCode: fr-CA
    languageName: Français
    weight: 1
    params:
      description: "Pauline Pic, professeure de géographie à l'Université du Québec à Rimouski, titulaire de la Chaire de recherche Transformer l'action pour le climat en géopolitique des mers et des océans."
      owner:
        institution: "Université du Québec à Rimouski (UQAR)"
    menu:
      main:
        - {name: "Bio & C.V.", pageRef: /bio, weight: 10}
        - {name: "Publications", pageRef: /publication, weight: 20}
        - {name: "Domaines de recherche", pageRef: /, weight: 30, params: {anchor: research-areas}}
        - {name: "Projets en cours", pageRef: /projets, weight: 40}
        - {name: "Médias", pageRef: /medias, weight: 45}
        - {name: "Co-auteurs", pageRef: /authors, weight: 50}
        - {name: "Enseignement", pageRef: /teaching, weight: 60}
        - {name: "Contact", pageRef: /contact, weight: 70}
  en:
    languageCode: en-CA
    languageName: English
    weight: 2
    params:
      description: "Pauline Pic is a professor of geography at the Université du Québec à Rimouski (UQAR) and holds the Research Chair Transforming Climate Action in the Geopolitics of Seas and Oceans."
      owner:
        institution: "Université du Québec à Rimouski (UQAR)"
    menu:
      main:
        - {name: "Bio & CV", pageRef: /bio, weight: 10}
        - {name: "Publications", pageRef: /publication, weight: 20}
        - {name: "Research areas", pageRef: /, weight: 30, params: {anchor: research-areas}}
        - {name: "Current projects", pageRef: /projets, weight: 40}
        - {name: "Media", pageRef: /medias, weight: 45}
        - {name: "Co-authors", pageRef: /authors, weight: 50}
        - {name: "Teaching", pageRef: /teaching, weight: 60}
        - {name: "Contact", pageRef: /contact, weight: 70}
